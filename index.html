<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>BSCD Pickups</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16202b;--mut:#5d6b7a;--line:#dfe3e8;--warn:#8a4b00;--warnbg:#fff1d6;--acc:#0b4f8a;--err:#a11b1b}
@media (prefers-color-scheme:dark){:root{--bg:#11161c;--card:#1a222b;--ink:#eef2f6;--mut:#9aa7b4;--line:#2c3742;--warn:#ffcf7a;--warnbg:#3a2b0c;--acc:#8cc4ff;--err:#ff9a9a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-size:20px;margin:4px 0 12px}
input{width:100%;font-size:20px;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--acc)}
button{font:inherit;border:0;border-radius:12px;padding:14px;background:var(--acc);color:var(--bg);font-weight:600;width:100%;margin-top:10px}
button.link{background:none;color:var(--mut);width:auto;padding:4px;margin:0;font-weight:400;font-size:14px;text-decoration:underline;white-space:nowrap}
#status{color:var(--mut);font-size:14px;margin:10px 2px;min-height:20px}
#status.err{color:var(--err)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.child{font-size:19px;font-weight:700}
.year{color:var(--mut);font-size:14px}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 0 4px}
.p{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.p b{font-weight:600}
.doc{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.p a{color:var(--acc);text-decoration:none;white-space:nowrap;font-variant-numeric:tabular-nums;padding:6px 0}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px;font-size:15px;margin-top:6px}
.foot{font-size:13px;color:var(--mut);margin:14px 2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><h1>Pickups · who can collect this child?</h1><button class="link" id="signout" hidden>Sign out</button></header>

<form id="gate" hidden>
  <input id="key" type="password" placeholder="Access key" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button type="submit">Enter</button>
</form>

<div id="search" hidden>
  <input id="q" type="search" placeholder="Student's first name or surname" autocomplete="off" autocapitalize="words">
</div>
<div id="status">Loading…</div>
<div id="res"></div>
<div class="foot" id="foot"></div>
</main>
<script>
(function () {
  'use strict';
  var MAX = 8, STORE = 'pickup-access-key';
  var $ = function (id) { return document.getElementById(id); };
  var gate = $('gate'), keyInput = $('key'), search = $('search'), q = $('q'), status = $('status'), res = $('res'), foot = $('foot'), signout = $('signout');
  var data = null, index = [], encrypted = null, timer = null;
  var ACCENTS = new RegExp('[' + String.fromCharCode(0x300) + '-' + String.fromCharCode(0x36f) + ']', 'g');

  function say(txt, err) { status.textContent = txt; status.className = err ? 'err' : ''; }
  function saved() { try { return localStorage.getItem(STORE) || ''; } catch (e) { return ''; } }
  function save(v) { try { v ? localStorage.setItem(STORE, v) : localStorage.removeItem(STORE); } catch (e) { /* no storage: the key is asked every time */ } }
  function bytes(b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function norm(s) { return String(s || '').normalize('NFD').replace(ACCENTS, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }

  function decrypt(k) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(k.trim()), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(encrypted.salt), iterations: encrypted.it }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(encrypted.iv) }, key, bytes(encrypted.ct));
    }).then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }

  function open(k, fromSaved) {
    say('Checking key…');
    decrypt(k).then(function (d) {
      data = d;
      index = d.students.map(function (s) { return ' ' + norm(s[0]); });
      save(k.trim());
      gate.hidden = true; search.hidden = false; signout.hidden = false; keyInput.value = '';
      say('Type at least 3 letters.');
      foot.textContent = 'ERP data as of ' + d.updated + ' · ' + d.students.length + ' active students';
      q.focus();
    }).catch(function () {
      save('');
      gate.hidden = false; search.hidden = true;
      say(fromSaved ? 'The access key has changed. Ask ICT for the new one.' : 'Wrong access key.', true);
      keyInput.focus();
    });
  }

  function person(x, isAuthorised) {
    var p = el('div', 'p'), i = el('div');
    i.appendChild(el('b', '', x[0] || '(no name)'));
    if (isAuthorised) i.appendChild(el('div', 'doc', x[2] ? 'ID ends in ' + x[2] : 'No ID on record'));
    p.appendChild(i);
    if (x[1]) { var a = el('a', '', x[1]); a.href = 'tel:' + String(x[1]).replace(/[^0-9+]/g, ''); p.appendChild(a); }
    return p;
  }

  function find() {
    var tokens = norm(q.value).split(' ').filter(Boolean);
    res.textContent = '';
    if (tokens.join('').length < 3) { say('Type at least 3 letters.'); return; }
    var found = [];
    index.forEach(function (n, i) { if (tokens.every(function (tk) { return n.indexOf(' ' + tk) >= 0; })) found.push(data.students[i]); });
    if (!found.length) { say('No active student matches. Check the spelling or try the surname only.'); return; }
    say(found.length > MAX ? 'Showing ' + MAX + ' of ' + found.length + '. Type more to narrow it down.' : found.length + (found.length === 1 ? ' student' : ' students'));
    found.slice(0, MAX).forEach(function (s) {
      var f = data.families[s[3]] || { g: [], a: [] }, c = el('div', 'card');
      c.appendChild(el('div', 'child', s[0]));
      c.appendChild(el('div', 'year', s[1] + ' · ' + s[2]));
      c.appendChild(el('h2', '', 'Parents / guardians'));
      if (f.g.length) f.g.forEach(function (x) { c.appendChild(person(x, false)); });
      else c.appendChild(el('div', 'note', 'Not listed separately: check the authorised list or ask the school office.'));
      c.appendChild(el('h2', '', 'Authorised to collect (' + f.a.length + ')'));
      if (f.a.length) f.a.forEach(function (x) { c.appendChild(person(x, true)); });
      else c.appendChild(el('div', 'note', 'Nobody else is authorised: only the parents / guardians may collect this child.'));
      res.appendChild(c);
    });
  }

  gate.addEventListener('submit', function (e) { e.preventDefault(); if (keyInput.value.trim()) open(keyInput.value, false); });
  q.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(find, 150); });
  signout.addEventListener('click', function () { save(''); location.replace(location.pathname); });

  if (!window.crypto || !crypto.subtle) { say('This browser cannot open the data. Use an up-to-date Chrome or Safari.', true); return; }
  fetch('data.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(); return r.json(); }).then(function (c) {
    encrypted = c;
    // The link may carry the key after "#": it is never sent to the server and is removed from the address bar on entry.
    var h = decodeURIComponent(location.hash.slice(1));
    if (h) history.replaceState(null, '', location.pathname);
    var k = h || saved();
    if (k) open(k, !h); else { gate.hidden = false; say('Enter the access key ICT gave you.'); keyInput.focus(); }
  }).catch(function () { say('Could not load the data. Check your connection and reload.', true); });
})();
</script>
</body>
</html>
