name: Publish pickup lookup

# The site is a single static page: people sign in with their school APP account and the page reads
# the ERP live with their own session. No data and no credentials are involved in publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          touch dist/.nojekyll
      # Preview of the dev branch at /dev/. Run this workflow manually after pushing to dev.
      - name: Add the dev preview
        run: |
          if git fetch --depth=1 origin dev 2>/dev/null; then
            mkdir -p dist/dev && git show FETCH_HEAD:index.html > dist/dev/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4
